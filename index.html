<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Actividad</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-icon">📋</span>
            <h2>Plan de Actividad</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#" onclick="nuevoPlan()" class="nav-link active">
                ➕ Nuevo Plan
            </a>
        </nav>
    </aside>

    <main class="main-content">
        
        <div class="card">
            <h1>PLAN DE ACTIVIDAD</h1>
            
            <!-- Datos generales -->
            <div class="form-row">
                <div class="form-group">
                    <label>Estaca</label>
                    <input type="text" id="estaca" class="form-control" placeholder="Nombre de la estaca">
                </div>
                <div class="form-group">
                    <label>Organización</label>
                    <input type="text" id="organizacion" class="form-control" placeholder="Ej: Hombres Jóvenes">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Barrio</label>
                    <input type="text" id="barrio" class="form-control" placeholder="Nombre del barrio">
                </div>
                <div class="form-group">
                    <label>Fecha de Actividad</label>
                    <input type="date" id="fecha" class="form-control">
                </div>
            </div>

            <!-- Propósito -->
            <div class="form-group">
                <label>PROPÓSITO SAGRADO de la actividad</label>
                <small>(para satisfacer las necesidades espirituales y temporales de los participantes)</small>
                <textarea id="proposito" class="form-control" rows="3" placeholder="Describa el propósito sagrado..."></textarea>
            </div>

            <!-- Metas -->
            <h3>META(S):</h3>
            <div class="metas-grid">
                <label class="meta-check"><input type="checkbox" value="Fortalecer/apoyar a la familia en aprender/vivir el Evangelio"> Fortalecer/apoyar a la familia en aprender/vivir el Evangelio</label>
                <label class="meta-check"><input type="checkbox" value="Fortalecer el testimonio y fomentar el progreso personal"> Fortalecer el testimonio y fomentar el progreso personal</label>
                <label class="meta-check"><input type="checkbox" value="Perfeccionar a los Santos"> Perfeccionar a los Santos</label>
                <label class="meta-check"><input type="checkbox" value="Proporcionar servicio significativo a otras personas"> Proporcionar servicio significativo a otras personas</label>
                <label class="meta-check"><input type="checkbox" value="Ofrecer oportunidades de aplicar los principios del Evangelio"> Ofrecer oportunidades de aplicar los principios del Evangelio</label>
                <label class="meta-check"><input type="checkbox" value="Adquirir/desarrollar aptitudes físicas, sociales, de liderazgo"> Adquirir/desarrollar aptitudes físicas, sociales, de liderazgo</label>
                <label class="meta-check"><input type="checkbox" value="Fomentar la unidad de los miembros y no miembros"> Fomentar la unidad de los miembros y no miembros</label>
                <label class="meta-check"><input type="checkbox" value="Proclamar el Evangelio"> Proclamar el Evangelio</label>
                <label class="meta-check"><input type="checkbox" value="Extender mano de amistad a no miembros, nuevos y menos activos"> Extender mano de amistad a no miembros, nuevos y menos activos</label>
                <label class="meta-check"><input type="checkbox" value="Redimir a los muertos"> Redimir a los muertos</label>
            </div>

            <!-- Participación -->
            <div class="form-group">
                <label>Total estimado de asistentes (investigadores, conversos, menos activos)</label>
                <input type="text" id="asistentes" class="form-control" placeholder="Ej: 50 personas">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Responsables de la actividad</label>
                    <input type="text" id="responsables" class="form-control" placeholder="Nombres de los responsables">
                </div>
                <div class="form-group">
                    <label>Responsables limpieza capilla</label>
                    <input type="text" id="limpieza" class="form-control" placeholder="Nombres de responsables de limpieza">
                </div>
            </div>

            <!-- Presupuesto -->
            <h2>💰 PLAN DE PRESUPUESTO (Antes de la actividad)</h2>
            <h3>GASTOS ANTICIPADOS</h3>
            
            <div class="presupuesto-header">
                <span>Cantidad</span>
                <span>Descripción</span>
                <span>Monto Unitario</span>
                <span>Subtotal</span>
                <span></span>
            </div>

            <div id="itemsPresupuesto"></div>
            
            <button onclick="agregarItemPresupuesto()" class="btn btn-sm btn-secondary">
                ➕ Agregar Item
            </button>
            
            <p class="total-right">
                <strong>TOTAL de gastos ANTICIPADOS:</strong>
                <span id="totalPresupuestoForm">Bs. 0,00</span>
            </p>

            <div class="form-actions">
                <button onclick="generarPDF()" class="btn btn-danger btn-lg">📄 Generar PDF</button>
            </div>
        </div>

    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
