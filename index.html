<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Actividades</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR SIMPLIFICADO -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-icon">📋</span>
            <h2>Sistema de Actividades</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#" onclick="mostrarLista()" class="nav-link active" id="navLista">
                📋 Actividades
            </a>
            <a href="#" onclick="mostrarFormulario()" class="nav-link" id="navNueva">
                ➕ Nueva Actividad
            </a>
        </nav>
        <div class="sidebar-footer">
            <small>v1.0</small>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        
        <!-- LISTA DE ACTIVIDADES -->
        <div id="listaActividades">
            <div class="page-header">
                <h1>📋 Actividades</h1>
                <button onclick="mostrarFormulario()" class="btn btn-primary">➕ Nueva Actividad</button>
            </div>
            <div id="tablaActividades"></div>
        </div>

        <!-- FORMULARIO -->
        <div id="formularioActividad" style="display:none;">
            <div class="card">
                <h2 id="tituloFormulario">Nueva Actividad</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Código</label>
                        <input type="text" id="codigo" class="form-control" readonly>
                    </div>
                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="date" id="fecha" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Organización *</label>
                    <select id="organizacion" class="form-control" required>
                        <option value="">Seleccione una organización...</option>
                        <option>Hombres Jóvenes</option>
                        <option>Mujeres Jóvenes</option>
                        <option>Sociedad de Socorro</option>
                        <option>Primaria</option>
                        <option>Escuela Dominical</option>
                        <option>Quórum de Élderes</option>
                        <option>Barrio</option>
                        <option>Estaca</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Nombre de la Actividad *</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ej: Noche de Hogar" required>
                </div>
                
                <div class="form-group">
                    <label>Propósito</label>
                    <textarea id="proposito" class="form-control" rows="3" placeholder="Describa el propósito..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Asistentes Estimados</label>
                        <input type="number" id="asistentes" class="form-control" value="0" min="0">
                    </div>
                    <div class="form-group">
                        <label>Responsable Principal</label>
                        <input type="text" id="responsable" class="form-control" placeholder="Nombre del responsable">
                    </div>
                </div>

                <h3>🎯 Metas</h3>
                <div class="metas-grid">
                    <label class="meta-check"><input type="checkbox" value="Perfeccionar a los Santos"> Perfeccionar a los Santos</label>
                    <label class="meta-check"><input type="checkbox" value="Proclamar el Evangelio"> Proclamar el Evangelio</label>
                    <label class="meta-check"><input type="checkbox" value="Redimir a los Muertos"> Redimir a los Muertos</label>
                    <label class="meta-check"><input type="checkbox" value="Fortalecer Familias"> Fortalecer Familias</label>
                    <label class="meta-check"><input type="checkbox" value="Integración"> Integración</label>
                    <label class="meta-check"><input type="checkbox" value="Servicio"> Servicio</label>
                    <label class="meta-check"><input type="checkbox" value="Desarrollo Personal"> Desarrollo Personal</label>
                </div>

                <!-- PRESUPUESTO -->
                <h3>💰 Presupuesto</h3>
                <div id="itemsPresupuesto"></div>
                <button onclick="agregarItemPresupuesto()" class="btn btn-sm btn-secondary">➕ Agregar Item</button>
                <p class="total-right">
                    <strong>Total Presupuestado: </strong>
                    <span id="totalPresupuestoForm">Bs. 0,00</span>
                </p>

                <!-- GASTOS -->
                <h3>💳 Gastos Ejecutados</h3>
                <div id="itemsGastos"></div>
                <button onclick="agregarItemGasto()" class="btn btn-sm btn-secondary">➕ Agregar Gasto</button>
                <p class="total-right">
                    <strong>Total Gastos: </strong>
                    <span id="totalGastosForm">Bs. 0,00</span>
                </p>

                <!-- COMPARATIVO -->
                <div class="comparativo-box">
                    <h3>📊 Comparativo</h3>
                    <div class="comp-item">
                        <span>Presupuesto:</span>
                        <strong id="compPresupuesto">Bs. 0,00</strong>
                    </div>
                    <div class="comp-item">
                        <span>Ejecutado:</span>
                        <strong id="compEjecutado">Bs. 0,00</strong>
                    </div>
                    <div class="comp-item" id="compDiferencia">
                        <span>Diferencia:</span>
                        <strong>Bs. 0,00</strong>
                    </div>
                    <div id="compIndicador" class="comp-indicador"></div>
                </div>

                <div class="form-group">
                    <label>Estado</label>
                    <select id="estado" class="form-control">
                        <option value="borrador">📝 Borrador</option>
                        <option value="en_revision">🔍 En Revisión</option>
                        <option value="aprobada">✅ Aprobada</option>
                        <option value="ejecutada">🚀 Ejecutada</option>
                        <option value="rendida">💰 Rendida</option>
                        <option value="cerrada">🔒 Cerrada</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button onclick="guardarActividad()" class="btn btn-success btn-lg">💾 Guardar Actividad</button>
                    <button onclick="generarPDF()" class="btn btn-danger btn-lg">📄 Generar PDF</button>
                    <button onclick="cancelarFormulario()" class="btn btn-secondary">Cancelar</button>
                </div>
                
                <input type="hidden" id="editandoId" value="">
            </div>
        </div>

    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
