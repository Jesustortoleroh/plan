<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Actuales - Panel Administrativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- ===== TOGGLE TEMA ===== -->
        <div class="theme-toggle">
            <button id="themeToggle" aria-label="Cambiar tema">🌓</button>
        </div>

        <!-- ===== SECCIÓN GASTOS ACTUALES ===== -->
        <section class="gastos-section" aria-labelledby="gastos-title">
            <header class="section-header">
                <h2 id="gastos-title">💳 Gastos Actuales</h2>
                <span class="gasto-count" id="gastoCount">3 gastos</span>
            </header>

            <form class="gastos-form" id="gastosForm" novalidate>
                <div class="table-responsive">
                    <table class="gastos-table" aria-label="Tabla de gastos actuales">
                        <thead>
                            <tr>
                                <th scope="col">Comprobante</th>
                                <th scope="col">Concepto</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Proveedor</th>
                                <th scope="col">Monto</th>
                                <th scope="col">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="gastosBody">
                            <!-- Fila 1 -->
                            <tr class="gasto-row">
                                <td>
                                    <input type="text" 
                                           id="comprobante_1" 
                                           placeholder="Ej: FAC-001" 
                                           aria-label="Número de comprobante" 
                                           required>
                                </td>
                                <td>
                                    <input type="text" 
                                           id="concepto_1" 
                                           placeholder="Ej: Compra de insumos" 
                                           aria-label="Concepto del gasto" 
                                           required>
                                </td>
                                <td>
                                    <input type="date" 
                                           id="fecha_1" 
                                           aria-label="Fecha del gasto" 
                                           required>
                                </td>
                                <td>
                                    <input type="text" 
                                           id="proveedor_1" 
                                           placeholder="Ej: Proveedor SA" 
                                           aria-label="Nombre del proveedor" 
                                           required>
                                </td>
                                <td>
                                    <input type="number" 
                                           id="monto_1" 
                                           placeholder="0.00" 
                                           step="0.01" 
                                           min="0" 
                                           aria-label="Monto del gasto" 
                                           required>
                                </td>
                                <td>
                                    <button type="button" 
                                            class="btn-eliminar" 
                                            aria-label="Eliminar este gasto" 
                                            onclick="eliminarGasto(this)">
                                        ✕
                                    </button>
                                </td>
                            </tr>

                            <!-- Fila 2 -->
                            <tr class="gasto-row">
                                <td>
                                    <input type="text" 
                                           id="comprobante_2" 
                                           placeholder="Ej: FAC-002" 
                                           aria-label="Número de comprobante" 
                                           required>
                                </td>
                                <td>
                                    <input type="text" 
                                           id="concepto_2" 
                                           placeholder="Ej: Servicios básicos" 
                                           aria-label="Concepto del gasto" 
                                           required>
                                </td>
                                <td>
                                    <input type="date" 
                                           id="fecha_2" 
                                           aria-label="Fecha del gasto" 
                                           required>
                                </td>
                                <td>
                                    <input type="text" 
                                           id="proveedor_2" 
                                           placeholder="Ej: Electricidad S.A." 
                                           aria-label="Nombre del proveedor" 
                                           required>
                                </td>
                                <td>
                                    <input type="number" 
                                           id="monto_2" 
                                           placeholder="0.00" 
                                           step="0.01" 
                                           min="0" 
                                           aria-label="Monto del gasto" 
                                           required>
                                </td>
                                <td>
                                    <button type="button" 
                                            class="btn-eliminar" 
                                            aria-label="Eliminar este gasto" 
                                            onclick="eliminarGasto(this)">
                                        ✕
                                    </button>
                                </td>
                            </tr>

                            <!-- Fila 3 -->
                            <tr class="gasto-row">
                                <td>
                                    <input type="text" 
                                           id="comprobante_3" 
                                           placeholder="Ej: FAC-003" 
                                           aria-label="Número de comprobante" 
                                           required>
                                </td>
                                <td>
                                    <input type="text" 
                                           id="concepto_3" 
                                           placeholder="Ej: Material de oficina" 
                                           aria-label="Concepto del gasto" 
                                           required>
                                </td>
                                <td>
                                    <input type="date" 
                                           id="fecha_3" 
                                           aria-label="Fecha del gasto" 
                                           required>
                                </td>
                                <td>
                                    <input type="text" 
                                           id="proveedor_3" 
                                           placeholder="Ej: Papelería Central" 
                                           aria-label="Nombre del proveedor" 
                                           required>
                                </td>
                                <td>
                                    <input type="number" 
                                           id="monto_3" 
                                           placeholder="0.00" 
                                           step="0.01" 
                                           min="0" 
                                           aria-label="Monto del gasto" 
                                           required>
                                </td>
                                <td>
                                    <button type="button" 
                                            class="btn-eliminar" 
                                            aria-label="Eliminar este gasto" 
                                            onclick="eliminarGasto(this)">
                                        ✕
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="6">
                                    <button type="button" 
                                            class="btn-agregar" 
                                            id="agregarGasto">
                                        ➕ Agregar Gasto
                                    </button>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-guardar">
                        💾 Guardar Gastos
                    </button>
                </div>
            </form>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
